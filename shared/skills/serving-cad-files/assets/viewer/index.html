<!doctype html>
<!-- CAD viewer shell. app.js bundles three.js (MIT © three.js authors). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD viewer</title>
<style>
  :root {
    --bg0: #eae7e0; --bg1: #f4f1eb;
    --panel: rgba(250, 248, 244, 0.92); --border: #ccc9c1;
    --fg: #283431; --dim: #626e69; --accent: #39766e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body[data-preset="inspection"] {
    --bg0: #131c26; --bg1: #1b2530; --panel: rgba(16,22,29,.92);
    --border: #354453; --fg: #dce6f0; --dim: #9aadbd; --accent: #5aa9e6;
  }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg);
    background: radial-gradient(120% 120% at 50% 20%, var(--bg1) 0%, var(--bg0) 70%);
    overflow: hidden;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .panel {
    position: fixed; z-index: 2;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    backdrop-filter: blur(6px);
  }
  #hud { top: 14px; left: 14px; max-width: min(340px, calc(100vw - 28px)); }
  #title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  #model {
    display: none; width: 100%; margin: 6px 0 2px; padding: 4px 6px;
    color: var(--fg); background: var(--bg0);
    border: 1px solid var(--border); border-radius: 6px; font: inherit;
  }
  #dims { margin-top: 4px; font-variant-numeric: tabular-nums; }
  #meta, #gridstep { color: var(--dim); font-size: 12px; }

  #toolbar { bottom: 14px; left: 14px; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; }
  #toolbar button {
    font: inherit; font-size: 12px; color: var(--fg);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  #toolbar button:hover { border-color: var(--accent); }
  #toolbar button.on { background: var(--accent); border-color: var(--accent); color: #0b1016; }
  #toolbar button.disabled { opacity: 0.35; pointer-events: none; }
  #toolbar .sep { width: 1px; background: var(--border); margin: 2px 2px; }

  #hint {
    position: fixed; right: 14px; bottom: 14px; z-index: 2;
    color: var(--dim); font-size: 12px; text-align: right;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  #status {
    position: fixed; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: none; max-width: 70vw; padding: 12px 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  #status.error { border-color: #e5484d; color: #ffb3b5; }
  #tooltip {
    position: fixed; z-index: 3; left: 0; top: 0; display: none;
    max-width: 40vw; padding: 3px 7px; font-size: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    backdrop-filter: blur(6px); pointer-events: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  #legend {
    top: 14px; right: 14px; width: min(240px, calc(100vw - 28px)); max-height: 70vh;
    display: none; flex-direction: column; padding: 8px 10px;
  }
  #legend-head { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  #legend-head label { display: flex; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
  #legend-toggle {
    font: inherit; font-size: 12px; color: var(--dim);
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 0 7px; cursor: pointer;
  }
  #legend-toggle:hover { border-color: var(--accent); color: var(--fg); }
  #legend-list { margin-top: 6px; overflow-y: auto; font-size: 12px; }
  #legend input[type="checkbox"] {
    accent-color: var(--accent); flex: none; width: 13px; height: 13px; margin: 0;
  }
  .lg-row { display: flex; align-items: center; gap: 4px; border-radius: 4px; }
  .lg-row:hover { background: rgba(90, 169, 230, 0.16); }
  .lg-row > label {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    padding: 2px 4px 2px 0; cursor: pointer;
  }
  .lg-row.lg-group > label { font-weight: 600; }
  .lg-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-tri {
    flex: none; width: 14px; padding: 0; font: inherit; font-size: 9px;
    color: var(--dim); background: transparent; border: 0; cursor: pointer;
  }
  .lg-tri:hover { color: var(--fg); }
  .lg-kids { padding-left: 20px; }
  #presentation { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; }
  #preset { font: inherit; color: var(--fg); background: var(--bg1); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  #eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--dim); margin-bottom: 5px; }
  #drawing { color: var(--accent); display: inline-block; margin-top: 8px; font-weight: 600; }
  #assembly-controls { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
  #assembly-controls label { display: flex; justify-content: space-between; }
  #explode { width: 100%; accent-color: var(--accent); margin: 9px 0; }
  #assembly-note { color: var(--dim); font-size: 11px; max-width: 290px; }
  #callouts { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #callouts path { stroke: #66766f; stroke-width: 1; fill: none; }
  #callouts circle { fill: #faf8f2; stroke: #52685e; stroke-width: 1; }
  #callouts text { fill: #283431; text-anchor: middle; dominant-baseline: central; font: 600 11px system-ui; }
  #hint { text-shadow: none; }
  #toolbar button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #meta { overflow-wrap: anywhere; }
  @media (max-width: 720px) {
    #hud { top: 10px; left: 10px; max-width: calc(100vw - 20px); padding: 9px 11px; }
    #title { font-size: 14px; }
    #presentation { margin: 5px 0; }
    #meta, #gridstep, #eyebrow { display: none; }
    #dims { font-size: 11px; }
    #legend { top: auto; right: 10px; bottom: 102px; max-height: 22vh; width: 190px; padding: 6px 8px; }
    #toolbar { bottom: 10px; left: 10px; right: 10px; gap: 5px; justify-content: center; }
    #toolbar button { padding: 6px 8px; }
    #hint { display: none; }
    #assembly-controls { padding-top: 6px; margin-top: 6px; }
    #assembly-note { max-width: 290px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<svg id="callouts" aria-hidden="true"></svg>

<div id="hud" class="panel">
  <div id="eyebrow">CAD / Presentation</div>
  <p id="title">CAD viewer</p>
  <select id="model"></select>
  <div id="presentation">
    <label for="preset">View style</label>
    <select id="preset">
      <option value="studio">Studio</option>
      <option value="inspection">Inspection</option>
      <option value="assembly">Assembly</option>
    </select>
  </div>
  <div id="dims"></div>
  <div id="meta"></div>
  <div id="gridstep"></div>
  <a id="drawing" hidden target="_blank" rel="noopener">Open vector drawing ↗</a>
  <div id="assembly-controls" hidden>
    <label for="explode">Explode <output id="explode-value">0%</output></label>
    <input id="explode" type="range" min="0" max="1" step="0.01" value="0" disabled>
    <div id="assembly-note"></div>
  </div>
</div>

<div id="toolbar" class="panel">
  <button id="btn-iso">Iso</button>
  <button id="btn-top">Top</button>
  <button id="btn-front">Front</button>
  <button id="btn-right">Right</button>
  <span class="sep"></span>
  <button id="btn-fit">Fit</button>
  <span class="sep"></span>
  <button id="btn-grid">Grid</button>
  <button id="btn-wire">Wire</button>
  <button id="btn-edges">Edges</button>
  <span class="sep"></span>
  <button id="btn-png" title="Download the model canvas without panels or callouts">Save PNG</button>
</div>

<div id="legend" class="panel">
  <div id="legend-head">
    <label><input type="checkbox" id="legend-all" checked><span>Components</span></label>
    <button id="legend-toggle" title="hide components">−</button>
  </div>
  <div id="legend-list"></div>
</div>

<div id="hint">drag orbit · right-drag / shift-drag pan · scroll zoom · double-click fit</div>
<div id="status">loading…</div>
<div id="tooltip"></div>

<script src="./app.js"></script>
</body>
</html>
