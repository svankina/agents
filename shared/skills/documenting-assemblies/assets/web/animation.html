<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="assembly-docs player">
<title>Assembly animation</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  :root {
    --bg: #f6f7f9; --ink: #2b2d31; --muted: #7b8089; --rule: #d9dce1;
    --red: #e0262d; --blue: #7d9cd6; --panel: rgba(255, 255, 255, 0.92);
    font-family: Lato, "Open Sans", "Noto Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  header { position: fixed; top: 16px; left: 20px; right: 340px; pointer-events: none; }
  header .kicker { color: var(--red); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
  header h1 { margin: 2px 0 0; font-weight: 300; font-size: 26px; letter-spacing: .01em; }
  #step-label { margin-top: 6px; font-size: 14px; color: var(--muted); }
  #panel {
    position: fixed; top: 12px; right: 12px; bottom: 92px; width: 316px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(6px);
  }
  body.panel-hidden #panel { display: none; }
  body.panel-hidden header { right: 20px; }
  #steps { flex: 1 1 auto; overflow-y: auto; padding: 8px 0; }
  .section { padding: 10px 16px 4px; color: var(--red); text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
  .step {
    display: flex; gap: 10px; width: 100%; padding: 6px 16px; border: 0; background: none;
    font: inherit; font-size: 13px; color: var(--ink); text-align: left; cursor: pointer;
  }
  .step:hover { background: #eef1f6; }
  .step.current { background: #e3eaf8; }
  .step .n { color: var(--muted); min-width: 1.6em; text-align: right; }
  #notes { flex: 0 0 auto; max-height: 40%; overflow-y: auto; border-top: 1px solid var(--rule); padding: 4px 16px 10px; }
  #notes:empty { display: none; }
  .note h4 { margin: 10px 0 2px; color: var(--red); font-weight: 400; font-size: 13px; }
  .note.warning h4 { font-weight: 700; }
  .note p { margin: 0; color: #5c616a; font-size: 12.5px; line-height: 1.45; }
  #bar {
    position: fixed; left: 12px; right: 12px; bottom: 12px; height: 68px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 0 14px;
  }
  .buttons, .options { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  button.ctl, select {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink); cursor: pointer;
  }
  button.ctl:hover { border-color: var(--blue); }
  #play { min-width: 76px; background: var(--blue); border-color: var(--blue); color: #fff; }
  .timeline { position: relative; }
  #scrub { width: 100%; margin: 0; accent-color: var(--red); }
  #ticks { position: absolute; left: 0; right: 0; top: -6px; height: 6px; pointer-events: none; }
  .tick { position: absolute; width: 1px; height: 6px; background: var(--muted); }
  .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  #clearance.draft { color: var(--red); font-weight: 700; }
  label.opt { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center; color: var(--muted); }
  #status.error { color: var(--red); }
  #hint { position: fixed; left: 20px; bottom: 90px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
  @media (max-width: 820px) {
    #panel { top: auto; bottom: 150px; height: 34%; left: 12px; right: 12px; width: auto; }
    header { right: 20px; }
    #bar { height: auto; grid-template-columns: 1fr; padding: 10px 14px; gap: 8px; }
    #hint { display: none; }
  }
</style>
</head>
<body data-mode="player">
<canvas id="view"></canvas>
<header>
  <div class="kicker">Assembly animation</div>
  <h1 id="title"></h1>
  <div id="step-label"></div>
</header>
<aside id="panel"><div id="steps"></div><div id="notes"></div></aside>
<div id="hint">Drag to orbit · right-drag or shift-drag to pan · scroll to zoom · space to play/pause · ←/→ steps</div>
<div id="bar">
  <div class="buttons">
    <button class="ctl" id="prev" title="Previous step (←)">◀︎</button>
    <button class="ctl" id="play" aria-pressed="false">Play</button>
    <button class="ctl" id="next" title="Next step (→)">▶︎</button>
  </div>
  <div class="timeline">
    <div id="ticks"></div>
    <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
    <div class="meta"><span id="time"></span><span id="clearance"></span></div>
  </div>
  <div class="options">
    <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <select id="style" aria-label="Style"><option value="shaded">Shaded</option><option value="line">Line art</option></select>
    <label class="opt"><input id="guides" type="checkbox" checked>Paths</label>
    <label class="opt"><input id="loop" type="checkbox">Loop</label>
    <button class="ctl" id="stepview" title="Step view (V)">View</button>
    <button class="ctl" id="fit" title="Fit (F)">Fit</button>
    <button class="ctl" id="panel-toggle" title="Show or hide steps">Steps</button>
  </div>
</div>
<div id="status">Loading…</div>
<script type="module" src="./app.js"></script>
</body>
</html>
