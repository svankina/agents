<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
<title id="t">Conversation: one request routed to three agents</title>
<!-- Family form: graphite disc, one light subject. No bubble (the sidebar's
     Messages header owns that shape) and no green (herd's finished status
     colour). Lavender carries no status meaning. Strokes are 7.8% of the
     viewbox and the branches spread to the disc edge so the three targets
     stay separate in the 18px dock row; the glow gives the mark mass at that
     size, the trunk node and terminals read from 96px up. -->
<defs>
 <radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop stop-color="#272338"/><stop offset=".6" stop-color="#181624"/><stop offset="1" stop-color="#0b0a11"/></radialGradient>
 <linearGradient id="lav" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#efe9ff"/><stop offset=".45" stop-color="#C7B8F2"/><stop offset="1" stop-color="#8f7fc4"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="disc"><circle cx="256" cy="256" r="248"/></clipPath>
</defs>
<g clip-path="url(#disc)">
 <rect width="512" height="512" fill="url(#bg)"/>
 <circle cx="256" cy="256" r="224" fill="none" stroke="#3a3355" stroke-width="2"/>
 <circle cx="256" cy="256" r="212" fill="none" stroke="#C7B8F2" stroke-width="3" stroke-dasharray="2 23" opacity=".3"/>
 <path d="M96 318A190 190 0 0 1 118 128" fill="none" stroke="#C7B8F2" stroke-width="5" opacity=".35"/>
 <g fill="none" stroke="#C7B8F2" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity=".35" filter="url(#glow)">
  <path d="M138 256h120"/>
  <path d="M258 256 378 118M258 256h120M258 256l120 138"/>
 </g>
 <g fill="none" stroke="url(#lav)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
  <path d="M138 256h120"/>
  <path d="M258 256 378 118M258 256h120M258 256l120 138"/>
 </g>
 <circle cx="138" cy="256" r="54" fill="#0b0a11"/>
 <circle cx="138" cy="256" r="54" fill="none" stroke="url(#lav)" stroke-width="32"/>
 <circle cx="378" cy="118" r="46" fill="#efe9ff"/>
 <circle cx="378" cy="256" r="46" fill="#efe9ff"/>
 <circle cx="378" cy="394" r="46" fill="#efe9ff"/>
</g>
<circle cx="256" cy="256" r="245" fill="none" stroke="#4a4168" stroke-width="3"/>
</svg>
