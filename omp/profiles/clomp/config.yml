# clomp profile — eval-tuned roles (2026-08-05): sonnet-5 interactive,
# codex (priority tier) for smol/task/advisor/commit, opus-5 for slow/plan.
# Basis: MVP evals in ~/src/omp session — e2e bugfix wall-clock, probes, bench.
modelRoles:
  default: anthropic/claude-sonnet-5
  smol: openai-codex/gpt-5.4-mini:medium
  slow: anthropic/claude-opus-5:high
  plan: anthropic/claude-opus-5:high
  vision: anthropic/claude-haiku-4-5:medium
  commit: openai-codex/gpt-5.4-mini:medium
  advisor: openai-codex/gpt-5.4-mini:medium
  designer: anthropic/claude-sonnet-5:medium
  task: openai-codex/gpt-5.5:medium
task:
  agentModelOverrides:
    scout: openai-codex/gpt-5.3-codex-spark:medium
    sonic: openai-codex/gpt-5.4-mini:low
tier:
  openai: priority
enabledModels:
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-5
  - anthropic/claude-fable-5
  - anthropic/claude-haiku-4-5
  - openai-codex/gpt-5.5
  - openai-codex/gpt-5.4-mini
  - openai-codex/gpt-5.3-codex-spark
defaultThinkingLevel: medium
startup:
  quiet: true
setupVersion: 1
dev:
  autoqaConsent: granted
# Shared look & feel (matches the base profile: shared extensions provide /mod
# and the startup display; statusLine is emptied because the omp-tokrate
# plugin draws the footer line).
symbolPreset: unicode
theme:
  dark: titanium
extensions:
  - ~/src/agents/omp/extensions
statusLine:
  preset: custom
  leftSegments:
    []
  rightSegments:
    []
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
